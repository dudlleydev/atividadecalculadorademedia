<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
    <script src="script.js"></script>
      <nav class="navbar bg-primary navbar-dark">
        <div class="container">
            <span class="navbar-brand">Calculadora de Média</span>
        </div>
    </nav>

   
    <div class="container text-center mt-4">
        <h1>Calcule sua média</h1>
        <p>Digite suas três notas para verificar sua situação.</p>

        <span class="badge bg-info">Média mínima: 7</span>
    </div>

    
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6">

                <div class="card p-3">
                    <label class="form-label">Nota 1</label>
                    <input type="number" id="nota1" class="form-control mb-3"
                           min="0" max="10" step="0.1">

                    <label class="form-label">Nota 2</label>
                    <input type="number" id="nota2" class="form-control mb-3"
                           min="0" max="10" step="0.1">

                           <label class="form-label">Nota 3</label>
                    <input type="number" id="nota3" class="form-control mb-3"
                           min="0" max="10" step="0.1">

                    <button class="btn btn-primary" onclick="calcular()">
                        Calcular média
                    </button>

                    <div id="resultado" class="mt-3"></div>
                </div>

            </div>
        </div>
    </div>

    
    <div class="container mt-4">
        <div class="row text-center">
            <div class="col-12 col-md-4 mb-2">
                <div class="card p-2">Notas de 0 a 10</div>
            </div>

            <div class="col-12 col-md-4 mb-2">
                <div class="card p-2">Média mínima: 7</div>
            </div>

            <div class="col-12 col-md-4 mb-2">
                <div class="card p-2">Resultado imediato</div>
            </div>
        </div>
    </div>

    <footer class="bg-primary text-white text-center p-3 mt-4">
        Calculadora de Média Escolar
    </footer>

   
    <script>
        function calcular() {
            let nota1 = Number(document.getElementById("nota1").value);
            let nota2 = Number(document.getElementById("nota2").value);
            let nota3 = Number(document.getElementById("nota3").value);

            let media = (nota1 + nota2 + nota3) / 3;
            let reprovado = media < 7;

            if (reprovado) {
                document.getElementById("resultado").innerHTML =
                    '<div class="alert alert-danger">Reprovado! Média: ' + media.toFixed(1) + '</div>';
            } else {
                document.getElementById("resultado").innerHTML =
                    '<div class="alert alert-success">Aprovado! Média: ' + media.toFixed(1) + '</div>';
            }
        }
    </script>
    
</body>
</html>
